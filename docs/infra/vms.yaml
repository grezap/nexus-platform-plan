  lakehouse:
    purpose: Lakehouse tier (Phase 0.L) -- MinIO (S3 object store) + Apache Iceberg (REST catalog + dedicated PG HA) + Apache Spark. Repo nexus-infra-lakehouse (tier 08-spark).
    phase: 0.L
    architecture: |
      0.L.1 MinIO distributed erasure-coded (4 nodes, a dedicated xfs data VMDK each
      at /mnt/minio/data, default EC:2). 0.L.2 Iceberg REST catalog (2 HA instances,
      round-robin iceberg.nexus.lab) backed by a dedicated PostgreSQL master-replica
      pair (streaming replication + keepalived VRRP VIP iceberg-db.nexus.lab .151).
      0.L.3 Spark standalone HA (2 masters ZK-elected + 3 workers, Iceberg via the
      Nessie REST catalog -> S3FileIO -> MinIO) + a dedicated 3-node Apache ZooKeeper
      ensemble (the one deliberate Apache-ZK exception; ADR-0035).
      Client front doors = round-robin DNS, no VIP except the catalog-DB VRRP VIP.
      RAM right-sized per feedback_prefer_less_memory.md. MAC block :99-:A3 (after
      analytics :98) for 0.L.1/0.L.2; 0.L.3 Spark HA expansion uses :AA-:AE (the
      :A4-:A9 gap is reserved for 0.L.4 registry + 0.L.5 SR shared-data); secondary
