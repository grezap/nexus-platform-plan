  # Phase 0.I observability tier (ADR-0038, scaffolded 2026-05-26).
  # Supersedes the prior single-VM obs-{metrics,tracing,logging} reservation at .90/.93/.94
  # (drafted pre-ADR-0025, never built; retired per ADR-0038 §Context). VMs share the
  # 01-foundation\<vm-name>\ dir convention (foundation-tier extension on disk) but live in
  # a separate repo `grezap/nexus-infra-observability` (per-tier-repo canon: kafka/oltp/
  # analytics/lakehouse/registry each own theirs). Stack = Grafana LGTM (Prom + Grafana +
  # Loki + Tempo + Alertmanager). 14 VMs + 2 VRRP VIPs. Reuses 0.L.1 MinIO as object store
  # for Loki/Tempo via dedicated `nexus-{loki,tempo}-app` tenants (mirrors 0.L.5 pattern).
  # Front door = VRRP VIP pair for Grafana (.184) + Grafana PG (.185) per ADR-0025;
  # machine endpoints (Prom/Loki/Tempo writes + OTel Collector) on round-robin DNS per
  # ADR-0031. mTLS via per-host `observability-server` Vault PKI cert. Hybrid shipper:
  # Prom scrape (node_exporter) + Vector (logs) + apps push OTLP (traces).
  # RAM sized minimally per feedback_prefer_less_memory.md; production sizing would double.
  observability:
    purpose: Observability tier (Phase 0.I) -- Prometheus HA + Grafana HA + Loki SSD + Tempo scalable + Alertmanager mesh + OTel Collector pair; MinIO S3 backend for Loki+Tempo (reuses 0.L.1)
    phase: 0.I (ADR-0038; 14 VMs + 2 VIPs)
    architecture: |
      Grafana LGTM stack with all roles HA per ADR-0025. Prom HA = 2 nodes that each
      scrape every fleet target (Grafana datasource dedups); Alertmanager mesh co-resident
      on the Prom pair. Loki simple-scalable = 3 nodes each running read+write+backend
      (memberlist gossip ring; MinIO bucket `loki` via dedicated `nexus-loki-app` tenant).
      Tempo scalable = 3 nodes each running distributor+ingester+querier+query-frontend+
      compactor (memberlist ring; MinIO bucket `tempo` via dedicated `nexus-tempo-app`
      tenant; OTLP receivers on :4317/:4318). Grafana HA = 2 active-active nodes behind
      VRRP VIP `grafana.nexus.lab .184` (unicast VRRP; cert IP-SAN includes the VIP).
      Grafana PG HA = 2 nodes streaming replication + keepalived VRRP VIP
      `grafana-db.nexus.lab .185` (mirrors 0.L.2 iceberg-db / 0.L.4 registry-db pattern).
      OTel Collector pair = 2 nodes behind round-robin DNS `otel.nexus.lab` (clients
      retry on connection failure, no VIP per ADR-0031 for write paths).
    virtual_ips:
      - { ip: 192.168.70.184, name: grafana.nexus.lab,    owners: "grafana-1 (MASTER prio 110) / grafana-2 (BACKUP prio 100)",       service: "Grafana HA front door (unicast VRRP; Phase 0.I.4)" }
      - { ip: 192.168.70.185, name: grafana-db.nexus.lab, owners: "grafana-pg-1 (MASTER prio 110) / grafana-pg-2 (BACKUP prio 100)", service: "Grafana Postgres HA front door (unicast VRRP; Phase 0.I.4)" }
    nodes:
      - { name: prom-1,            os: deb13, vcpu: 2, ram_gb: 4, disk_gb: 80, vmnet10: 192.168.10.170, vmnet11: 192.168.70.170, dir: H:\VMS\NexusPlatform\01-foundation\prom-1,            role: "Prometheus + Alertmanager #1 (HA pair; both Proms scrape every target; Alertmanager mesh peer)" }
      - { name: prom-2,            os: deb13, vcpu: 2, ram_gb: 4, disk_gb: 80, vmnet10: 192.168.10.171, vmnet11: 192.168.70.171, dir: H:\VMS\NexusPlatform\01-foundation\prom-2,            role: "Prometheus + Alertmanager #2 (HA pair; Alertmanager mesh peer)" }
      - { name: loki-1,            os: deb13, vcpu: 2, ram_gb: 4, disk_gb: 40, vmnet10: 192.168.10.172, vmnet11: 192.168.70.172, dir: H:\VMS\NexusPlatform\01-foundation\loki-1,            role: "Loki simple-scalable #1 (read+write+backend; memberlist ring; MinIO S3 backend)" }
      - { name: loki-2,            os: deb13, vcpu: 2, ram_gb: 4, disk_gb: 40, vmnet10: 192.168.10.173, vmnet11: 192.168.70.173, dir: H:\VMS\NexusPlatform\01-foundation\loki-2,            role: "Loki simple-scalable #2 (read+write+backend)" }
      - { name: loki-3,            os: deb13, vcpu: 2, ram_gb: 4, disk_gb: 40, vmnet10: 192.168.10.174, vmnet11: 192.168.70.174, dir: H:\VMS\NexusPlatform\01-foundation\loki-3,            role: "Loki simple-scalable #3 (read+write+backend)" }
      - { name: tempo-1,           os: deb13, vcpu: 2, ram_gb: 4, disk_gb: 40, vmnet10: 192.168.10.175, vmnet11: 192.168.70.175, dir: H:\VMS\NexusPlatform\01-foundation\tempo-1,           role: "Tempo scalable #1 (distributor+ingester+querier+query-frontend+compactor; memberlist ring; MinIO S3 backend; OTLP :4317/:4318)" }
      - { name: tempo-2,           os: deb13, vcpu: 2, ram_gb: 4, disk_gb: 40, vmnet10: 192.168.10.176, vmnet11: 192.168.70.176, dir: H:\VMS\NexusPlatform\01-foundation\tempo-2,           role: "Tempo scalable #2" }
      - { name: tempo-3,           os: deb13, vcpu: 2, ram_gb: 4, disk_gb: 40, vmnet10: 192.168.10.177, vmnet11: 192.168.70.177, dir: H:\VMS\NexusPlatform\01-foundation\tempo-3,           role: "Tempo scalable #3" }
      - { name: grafana-1,         os: deb13, vcpu: 2, ram_gb: 3, disk_gb: 40, vmnet10: 192.168.10.178, vmnet11: 192.168.70.178, dir: H:\VMS\NexusPlatform\01-foundation\grafana-1,         role: "Grafana HA #1 (active-active over shared PG; keepalived MASTER candidate for VIP .184)" }
      - { name: grafana-2,         os: deb13, vcpu: 2, ram_gb: 3, disk_gb: 40, vmnet10: 192.168.10.179, vmnet11: 192.168.70.179, dir: H:\VMS\NexusPlatform\01-foundation\grafana-2,         role: "Grafana HA #2 (keepalived BACKUP for VIP .184)" }
      - { name: grafana-pg-1,      os: deb13, vcpu: 2, ram_gb: 2, disk_gb: 60, vmnet10: 192.168.10.180, vmnet11: 192.168.70.180, dir: H:\VMS\NexusPlatform\01-foundation\grafana-pg-1,      role: "Grafana Postgres PRIMARY (streaming repl; keepalived MASTER for VIP .185)" }
      - { name: grafana-pg-2,      os: deb13, vcpu: 2, ram_gb: 2, disk_gb: 60, vmnet10: 192.168.10.181, vmnet11: 192.168.70.181, dir: H:\VMS\NexusPlatform\01-foundation\grafana-pg-2,      role: "Grafana Postgres REPLICA (keepalived BACKUP for VIP .185)" }
      - { name: otel-collector-1,  os: deb13, vcpu: 2, ram_gb: 2, disk_gb: 40, vmnet10: 192.168.10.182, vmnet11: 192.168.70.182, dir: H:\VMS\NexusPlatform\01-foundation\otel-collector-1,  role: "OTel Collector #1 (OTLP receivers :4317/:4318; routes traces->Tempo, metrics->Prom remote-write, logs->Loki)" }
      - { name: otel-collector-2,  os: deb13, vcpu: 2, ram_gb: 2, disk_gb: 40, vmnet10: 192.168.10.183, vmnet11: 192.168.70.183, dir: H:\VMS\NexusPlatform\01-foundation\otel-collector-2,  role: "OTel Collector #2 (round-robin DNS otel.nexus.lab; no VIP per ADR-0031 for write paths)" }

  sqlserver:
    purpose: SQL Server FCI + Always On AG (Phase 0.G.7 -- hybrid FCI+AG; FCI pair shares iSCSI LUN from nexus-gateway, AG replicas hold async copies)
    phase: 0.G.7 (PROVEN COLD-REBUILDABLE 2026-05-22; destroy+packer-build+apply-from-zero; smoke-0.G.7 ALL GREEN 56/56)
    architecture: |
      Hybrid FCI + AG (sealed with Greg 2026-05-20). sql-fci-1/2 form a
      2-node WSFC Failover Cluster Instance sharing an iSCSI LUN (60 GB
      sparse, exported by tgt on nexus-gateway per ADR-0026). The FCI
      virtual server identity is `sqlfci` at .70.16 (distinct from the WSFC
      cluster CNO `sql-fci-cluster` at .70.15 -- the two must differ); user
      DBs live on the iSCSI LUN as a clustered Physical Disk at S:\\.
      sql-ag-rep-1/2 are standalone SQL instances holding async AG
      replicas of the FCI's user DBs (seeded MANUALLY -- FCI DBs on shared
      S:\\ vs replicas on local C:\\ rules out AUTOMATIC seeding). WSFC
      quorum spans all 4 nodes (node-majority, tolerates 1 failure).
      The AG Listener (sql-ag-listener at .70.17) is the LB-tier HA
      primitive per ADR-0025 -- SQL clients connect to .17, WSFC migrates
      the IP atomically across AG primary failover. Listener cert IP-SAN
      includes .17 so Encrypt=True;TrustServerCertificate=False validates
      across failover.
      SQL service identity = nexus.lab\\gmsa-sql-engine$ (GMSA; first
      real GMSA consumer in the lab; 0.D.5 scaffolded the infrastructure).
      AG endpoint authentication = certificate-based per ADR-0027.
    nodes:
      - { name: sql-fci-1,     os: ws2025-desktop, vcpu: 4, ram_gb: 16, disk_gb: 200, vmnet10: 192.168.10.11, vmnet11: 192.168.70.11, dir: H:\VMS\NexusPlatform\02-sqlserver\sql-fci-1,     role: "FCI node 1 (WSFC member; iSCSI initiator; sql-fci-cluster owner candidate)" }
      - { name: sql-fci-2,     os: ws2025-desktop, vcpu: 4, ram_gb: 16, disk_gb: 200, vmnet10: 192.168.10.12, vmnet11: 192.168.70.12, dir: H:\VMS\NexusPlatform\02-sqlserver\sql-fci-2,     role: "FCI node 2 (WSFC member; iSCSI initiator; sql-fci-cluster owner candidate)" }
      - { name: sql-ag-rep-1,  os: ws2025-desktop, vcpu: 4, ram_gb: 12, disk_gb: 200, vmnet10: 192.168.10.13, vmnet11: 192.168.70.13, dir: H:\VMS\NexusPlatform\02-sqlserver\sql-ag-rep-1,  role: "AG async replica 1 (WSFC member; local storage)" }
      - { name: sql-ag-rep-2,  os: ws2025-desktop, vcpu: 4, ram_gb: 12, disk_gb: 200, vmnet10: 192.168.10.14, vmnet11: 192.168.70.14, dir: H:\VMS\NexusPlatform\02-sqlserver\sql-ag-rep-2,  role: "AG async replica 2 (WSFC member; local storage)" }
    virtual_ips:
      wsfc: 192.168.70.15            # WSFC cluster management IP (not a SQL endpoint; for Get-Cluster ops from anywhere on VMnet11)
      fci: 192.168.70.16             # FCI virtual server IP; SQL clients targeting the FCI directly connect here; migrates between sql-fci-1/2 via WSFC role
      ag_listener: 192.168.70.17     # AG Listener IP per ADR-0025 (the LB-tier HA primitive); SQL clients connect here; WSFC migrates with the AG primary across failover
    shared_storage:
      type: iSCSI
      target: iqn.2026-05.local.nexus:sql-fci.lun1
      backing: /srv/iscsi/sql-fci-shared.img (60 GB sparse on nexus-gateway)
      lun_path_on_fci: S:\\ (formatted NTFS 64K, attached as a clustered Physical Disk -- a single-instance FCI takes a dedicated cluster disk, not a CSV)
      consumers: [sql-fci-1, sql-fci-2]   # only the FCI pair attaches; AG replicas use local storage
      auth: CHAP (incoming-user sql-fci-initiator; secret in Vault KV at nexus/oltp/sqlserver/iscsi-chap-secret)
      adr: ADR-0026

