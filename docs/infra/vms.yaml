  starrocks:
    purpose: StarRocks FE + BE cluster (Phase 0.G.6 -- 3 FE BDB-JE quorum [1 leader + 2 follower] + 3 BE; tablets DISTRIBUTED BY HASH BUCKETS n + replication_num=3 across all 3 BE; ADR-0030)
    phase: 0.G.6
    # Client front door = round-robin DNS `starrocks-fe.nexus.lab` (multi-A over the
    # 3 FE) -- NO VRRP VIP / no LB pair. StarRocks FE is any-node-addressable on the
    # MySQL protocol (Followers forward DDL to the Leader), so there is no fixed
    # endpoint that would be a SPOF without a VIP. Documented in ADR-0031 (resolves
    # ADR-0025's analytics open question). No `virtual_ips:` block here is intentional.
